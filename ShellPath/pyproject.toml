[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellpath"
version = "0.1.0"
description = "Convert Windows MTP Shell paths into human-readable Explorer paths."
requires-python = ">=3.9"
dependencies = [
    "pywin32; platform_system == 'Windows'"
]

[project.scripts]
phn_shellpath = "shellpath:main"